<style>
:root{
  --bg:#ffffff; --bg-alt:#f6f7f9; --ink:#14171a; --ink-soft:#5b6470; --line:#e5e8eb;
  --brand:#009DE0; --brand-d:#0079ac; --brand-bg:#dbf1fb;
  --c-vivienda:#00C96B; --c-programas:#F2C100; --c-alimentacion:#FF3CB2; --c-conectividad:#F27C00;
  --c-discapacidad:#00C96B; --c-am:#F2C100; --c-ninez:#FF3CB2; --c-salud:#F27C00;
  --c-mascotas:#00C96B; --c-servicios:#F2C100; --c-barrios:#FF3CB2;
  --tint-verde:#dbf7ea; --tint-amarillo:#fdf6db; --tint-magenta:#ffe4f4; --tint-naranja:#fdeddb;
  --radius:14px; --shadow:0 1px 2px rgba(20,23,26,.06), 0 1px 12px rgba(20,23,26,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1216; --bg-alt:#171b21; --ink:#eef1f4; --ink-soft:#a3adb8; --line:#262c34; --brand-bg:#102d39;
    --tint-verde:#103524; --tint-amarillo:#3c3310; --tint-magenta:#3e1b30; --tint-naranja:#3c2710;
  }
}
.material-symbols-outlined{
  font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;
  font-size:18px;line-height:1;display:inline-block;vertical-align:-3px;
  -webkit-font-smoothing:antialiased;
  font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Google Sans","Product Sans","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  line-height:1.45;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.topbar{flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;flex-wrap:wrap;gap:12px 20px;padding-top:12px;padding-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo img{height:45px !important;max-height:45px !important;width:auto !important;display:block !important}



.logo .plus{font-weight:800;font-size:18px;color:var(--ink)}
.mapbar-row{display:flex;flex:1;flex-wrap:wrap;align-items:center;gap:8px 20px;min-width:0}
.title-block{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.title-block h1{font-size:16px;font-weight:800;margin:0;letter-spacing:-.01em}
.title-block span{font-size:11.5px;color:var(--ink-soft);font-weight:600}
.back-link{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--brand-d);text-decoration:none;padding:7px 12px;border-radius:999px;background:var(--brand-bg)}
.metric-select{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;background:var(--bg-alt);color:var(--ink);cursor:pointer;max-width:260px}
.app{flex:1;display:flex;min-height:0;position:relative}
#map{flex:1;min-width:0}
.leaflet-container{font-family:inherit;background:#eef2f5}
#panel{
  width:340px;flex-shrink:0;background:var(--bg);border-left:1px solid var(--line);
  overflow-y:auto;padding:20px;
}
#panel .empty{color:var(--ink-soft);font-size:13.5px;padding-top:8px}
#panel .empty .material-symbols-outlined{display:block;font-size:32px;margin:0 0 10px;opacity:.4}
#panel h2{font-size:19px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
#panel .panel-sub{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:16px}
.panel-hero{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.panel-hero div{background:var(--bg);padding:12px}
.panel-hero strong{display:block;font-size:20px;font-weight:900}
.panel-hero span{font-size:11px;color:var(--ink-soft);font-weight:600}
.cat-block{margin-bottom:14px}
.cat-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:var(--ink);margin-bottom:8px}
.cat-chip .material-symbols-outlined{font-size:13px}
.stat-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 0;font-size:12.5px}
.stat-row .label{color:var(--ink-soft);flex:1}
.stat-row .val{font-weight:800;white-space:nowrap}
.stat-row .val small{font-weight:400;color:var(--ink-soft);margin-left:4px}
.no-data-note{font-size:12.5px;color:var(--ink-soft);background:var(--bg-alt);border-radius:10px;padding:12px;margin-top:8px}
.legend{
  position:absolute;left:14px;bottom:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;font-size:12px;box-shadow:var(--shadow);z-index:400;max-width:220px
}
.legend .legend-title{font-weight:700;margin-bottom:6px;font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
.legend-scale{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-bottom:4px}
.legend-scale div{flex:1}
.legend-labels{display:flex;justify-content:space-between;color:var(--ink-soft);font-size:10.5px}
.legend-gray{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--ink-soft)}
.legend-gray i{width:10px;height:10px;border-radius:3px;background:#cbd0d6;display:inline-block}
@media (max-width:760px){
  #panel{position:absolute;right:0;top:0;bottom:0;z-index:500;box-shadow:-4px 0 16px rgba(0,0,0,.15)}
  #panel.hidden{display:none}
  .app{position:relative}
}
</style>
</head>

const sel = document.getElementById('metricSelect');
METRICS.forEach(m => {
  const opt = document.createElement('option');
  opt.value = m.key; opt.textContent = m.label;
  sel.appendChild(opt);
});

function lerp(a,b,t){ return Math.round(a+(b-a)*t); }
function lerpColor(hex1,hex2,t){
  const c1=[1,3,5].map(i=>parseInt(hex1.slice(i,i+2),16));
  const c2=[1,3,5].map(i=>parseInt(hex2.slice(i,i+2),16));
  const c=c1.map((v,i)=>lerp(v,c2[i],t));
  return 'rgb('+c.join(',')+')';
}

let currentMetric = METRICS[0];

function colorFor(value, min, max){
  if(value==null) return '#cbd0d6';
  const t = max>min ? (value-min)/(max-min) : 0.5;
  return lerpColor('#dbf1fb', '#007bb3', Math.max(0,Math.min(1,t)));
}

function renderLegend(min, max){
  const steps = 5;
  const bars = [];
  for(let i=0;i<steps;i++){
    bars.push('<div style="background:'+colorFor(min+(max-min)*i/(steps-1), min, max)+'"></div>');
  }
  document.getElementById('legend').innerHTML =
    '<div class="legend-title">'+currentMetric.label+'</div>'+
    '<div class="legend-scale">'+bars.join('')+'</div>'+
    '<div class="legend-labels"><span>'+(currentMetric.isPct? min.toFixed(0)+'%' : fmtN(Math.round(min)))+'</span><span>'+(currentMetric.isPct? max.toFixed(0)+'%' : fmtN(Math.round(max)))+'</span></div>'+
    '<div class="legend-gray"><i></i> Sin datos de la encuesta</div>';
}

let geoLayer;
const map = L.map('map', { zoomControl: true }).setView([-33.125, -64.35], 13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19,
}).addTo(map);

function styleFor(feature){
  const stats = feature.properties.stats;
  const value = stats ? currentMetric.get(stats) : null;
  return {
    fillColor: colorFor(value, currentMetric._min, currentMetric._max),
    fillOpacity: stats ? 0.72 : 0.35,
    color: stats ? '#0079ac' : '#8a919a',
    weight: 1.4,
    opacity: 0.9,
  };
}

function computeMinMax(metric){
  const values = SECTORES.features
    .map(f => f.properties.stats ? metric.get(f.properties.stats) : null)
    .filter(v => v != null);
  metric._min = values.length ? Math.min(...values) : 0;
  metric._max = values.length ? Math.max(...values) : 1;
}

function categoryBlock(chipClass, icon, title, rows){
  return '<div class="cat-block">'+
    '<span class="cat-chip '+chipClass+'"><span class="material-symbols-outlined">'+icon+'</span>'+title+'</span>'+
    rows.map(([label,val,base]) => (
      '<div class="stat-row"><span class="label">'+label+'</span><span class="val">'+val+(base!=null?' <small>('+fmtN(base)+')</small>':'')+'</span></div>'
    )).join('') +
  '</div>';
}

function renderPanel(feature){
  const panel = document.getElementById('panel');
  const props = feature.properties;
  if(!props.stats){
    panel.innerHTML =
      '<h2>'+props.name+'</h2>'+
      '<div class="panel-sub">Sector vectorizado sin datos de encuesta</div>'+
      '<div class="no-data-note">Este sector no tiene encuestas registradas en la base del Gabinete Social + LMetB con un nombre de barrio que coincida.</div>';
    return;
  }
  if(props.relevamientos){
    const total = props.relevamientos.reduce((s,r) => s + (r.stats ? r.stats.encuestas : 0), 0);
    panel.innerHTML =
      '<h2>'+props.barrio+'</h2>'+
      '<div class="panel-sub">'+fmtN(total)+' encuestas relevadas en 2 momentos distintos</div>'+
      '<div class="no-data-note">Este barrio se relevó dos veces con una diferencia de varios meses. Para no mezclar situaciones de momentos distintos, los datos se muestran por separado.</div>'+
      props.relevamientos.map(r =>
        '<div class="cat-block" style="margin-top:6px"><span class="cat-chip tint-naranja"><span class="material-symbols-outlined">event</span>Relevamiento del '+r.label+'</span></div>'+
        (r.stats ? statBlocksHTML(r.stats) : '<div class="no-data-note">Sin datos</div>')
      ).join('<div style="height:6px"></div>');
    return;
  }
  const s = props.stats;
  panel.innerHTML =
    '<h2>'+props.barrio+'</h2>'+
    '<div class="panel-sub">'+fmtN(s.encuestas)+' encuestas relevadas</div>'+
    statBlocksHTML(s);
}

function redraw(){
  computeMinMax(currentMetric);
  if(geoLayer) geoLayer.remove();
  geoLayer = L.geoJSON(SECTORES, {
    style: styleFor,
    onEachFeature: (feature, layer) => {
      const stats = feature.properties.stats;
      const label = feature.properties.barrio || feature.properties.name;
      layer.bindTooltip(label + (stats ? ' — ' + (currentMetric.isPct ? fmtPct(currentMetric.get(stats)) : fmtN(currentMetric.get(stats))) : ' (sin datos)'), { sticky: true });
      layer.on('click', () => renderPanel(feature));
      layer.on('mouseover', () => layer.setStyle({ weight: 3 }));
      layer.on('mouseout', () => layer.setStyle({ weight: 1.4 }));
    }
  }).addTo(map);
  renderLegend(currentMetric._min, currentMetric._max);
}

sel.addEventListener('change', () => {
  currentMetric = METRICS.find(m => m.key === sel.value);
  redraw();
});

redraw();
</script>
</body>
</html>
